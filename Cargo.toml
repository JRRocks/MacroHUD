[package]
name = "macrohud"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Macros clavier et souris pour Windows, pilotées depuis un petit HUD"
repository = "https://github.com/JRRocks/MacroHUD"
publish = false

[dependencies]
# The HUD window, in egui (D-03). OpenGL renderer (glow): small, quick to start, and the one that
# supports a transparent window on Windows, should the HUD want rounded or irregular shapes.
# "x11" only lets the crate build and run on Linux (tests, development); it adds nothing on Windows.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# Version information of macrohud.exe (file properties), and its icon once src/hud/icone.ico exists.
# rc.exe comes from the Windows SDK.
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[lints.rust]
# Unsafe code lives in src/platform/windows.rs only (the Windows API), which allows it explicitly.
unsafe_code = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
